<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attigo Logo Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f7f9;
            padding: 40px 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #1a1f26;
            margin-bottom: 40px;
            font-weight: 500;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
            gap: 30px;
            max-width: 900px;
            margin: 0 auto;
        }
        .preview-card {
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .preview-card.light {
            background: #FAFBFC;
        }
        .preview-card.dark {
            background: #2E4A62;
        }
        .preview-card h2 {
            margin-bottom: 30px;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .preview-card.light h2 {
            color: #6b7280;
        }
        .preview-card.dark h2 {
            color: rgba(255,255,255,0.8);
        }
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 180px;
        }
        .logo-container img {
            width: 100%;
            max-width: 320px;
            height: auto;
        }
        .color-info a { color: inherit; }
        .preview-card.dark .color-info { color: rgba(255,255,255,0.8); }
        .color-info {
            margin-top: 20px;
            font-size: 13px;
            color: #626A78;
        }
    </style>
</head>
<body>
    <h1>Attigo Logo — Original Mark</h1>
    
    <div class="preview-grid">
        <div class="preview-card light">
            <h2>On Light Background</h2>
            <div class="logo-container">
                <img src="logo-reference-navy.svg" alt="Attigo original mark in navy" width="1258" height="650">
            </div>
            <p class="color-info">Color: #2E4A62 (Primary)</p>
            <p class="color-info"><a href="logo-reference-navy.svg" download>Download navy SVG</a></p>
        </div>
        
        <div class="preview-card dark">
            <h2>On Dark Background</h2>
            <div class="logo-container">
                <img src="logo-reference-white.svg" alt="Attigo original mark in white" width="1258" height="650">
            </div>
            <p class="color-info">Color: White</p>
            <p class="color-info"><a href="logo-reference-white.svg" download>Download white SVG</a></p>
        </div>
    </div>
    
    <div style="text-align: center; margin-top: 60px;">
        <h2 style="font-weight: 500; margin-bottom: 20px;">Original for Reference</h2>
        <img src="logo.png" alt="Original Logo" style="width: 100%; max-width: 560px; height: auto; border-radius: 8px;">
    </div>
</body>
</html>
